version: '3.8'

services:
    postgres:
        image: postgres:15-alpine
        container_name: storylingua_postgres
        restart: unless-stopped
        environment:
            POSTGRES_USER: ${POSTGRES_USER}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
            POSTGRES_DB: ${POSTGRES_DB}
            # Optimize for VPS
            POSTGRES_SHARED_BUFFERS: 128MB
            POSTGRES_EFFECTIVE_CACHE_SIZE: 512MB
            POSTGRES_MAX_CONNECTIONS: 20
        volumes:
            - postgres_data:/var/lib/postgresql/data
            - ./postgres/postgresql.conf:/etc/postgresql/postgresql.conf
        command: postgres -c config_file=/etc/postgresql/postgresql.conf
        healthcheck:
            test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER}']
            interval: 30s
            timeout: 10s
            retries: 3
        # Limit Resources
        deploy:
            resources:
                limits:
                    cpus: '0.5'
                    memory: 512M
                reservations:
                    cpus: '0.25'
                    memory: 256M

    backend:
        build:
            context: ./backend
            dockerfile: Dockerfile
        container_name: storylingua_backend
        restart: unless-stopped
        environment:
            NODE_ENV: production
            PORT: 5000
            DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
            JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
        depends_on:
            postgres:
                condition: service_healthy
        # Limit Resources
        deploy:
            resources:
                limits:
                    cpus: '0.5'
                    memory: 512M
                reservations:
                    cpus: '0.25'
                    memory: 256M

    frontend:
        build:
            context: ./frontend
            dockerfile: Dockerfile
        container_name: storylingua_frontend
        restart: unless-stopped
        environment:
            NODE_ENV: production
            NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
        depends_on:
            - backend
        # Limit Resources
        deploy:
            resources:
                limits:
                    cpus: '0.5'
                    memory: 512M
                reservations:
                    cpus: '0.25'
                    memory: 256M

    nginx:
        image: nginx:alpine
        container_name: storylingua_nginx
        restart: unless-stopped
        ports:
            - '80:80'
            - '443:443'
        volumes:
            - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
            - ./nginx/conf.d:/etc/nginx/conf.d:ro
            - ./certbot/conf:/etc/letsencrypt:ro
            - ./certbot/www:/var/www/certbot:ro
        depends_on:
            - frontend
            - backend
        deploy:
            resources:
                limits:
                    cpus: '0.25'
                    memory: 128M

volumes:
    postgres_data:
